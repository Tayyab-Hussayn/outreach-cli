# Outreach CLI Configuration Settings

rate_limits:
  whatsapp:
    min_delay_seconds: 12
    max_delay_seconds: 28
    batch_size: 15
    daily_limit: 80
  mail:
    min_delay_seconds: 5
    max_delay_seconds: 15
    batch_size: 20
    daily_limit: 100

safety:
  typing_simulation:
    enabled: true
    ms_per_char: 35              # Mimic natural typing speed (~35ms per character)
    min_duration_seconds: 2      # Minimum typing indicator time
    max_duration_seconds: 6      # Maximum typing indicator time
  batch_break:
    enabled: true
    interval_messages: 4          # Take a rest break every 4 leads
    min_rest_seconds: 60         # Fixed 1 minute rest
    max_rest_seconds: 60         # Same as min = exactly 1 minute
  circuit_breaker:
    enabled: true
    max_consecutive_failures: 3  # Stop workflow if 3 consecutive failures occur to avoid session ban
  anti_fingerprint:
    spintax_enabled: true        # Parses {Hi|Hello|Hey} syntax in templates
    zero_width_hash: true        # Injects subtle invisible zero-width spaces for unique message hashes
    browser_preset: "macOS"      # Official macOS Desktop Baileys fingerprint
    stealth_connect: true        # markOnlineOnConnect: false (avoids instant bot online flag)
  auto_archive_leads: true       # Move fully processed lead file to archives/ subdirectory
  lead_hold:                     # Fixed hold after each lead, then the next lead is targeted
    enabled: true
    seconds: 10                  # 10s after every lead (replaces the random 12-28s delay while enabled)
    jitter_percent: 20           # +/-20% -> 8-12s, so the rhythm is not robotic. Set 0 for exactly 10s
  human_behavior:
    enabled: true                # Master switch for everything below
    presence_cycle: true         # "online" while messaging a lead, "offline" while holding
    think_pause_seconds: [1, 4]  # Open the chat and think before typing
    typing_bursts: true          # Long messages are typed in 2-3 bursts with small pauses
    between_messages_seconds: [2, 5]   # Pause between the text and the demo video
    linger_after_send_seconds: [2, 5]  # Stay in the chat after sending (counts inside the hold)
    lookup_gap_seconds: [1.5, 4]       # Random gap before checking a number on WhatsApp
    randomize_rest_interval: false     # Exactly every 4 leads (no 4-7 randomizing)
    distraction:
      chance_percent: 8          # Sometimes pause as if distracted
      min_seconds: 20
      max_seconds: 60
  limits:
    enforce_daily_limit: true    # Stop at rate_limits.whatsapp.daily_limit per day (/whatsapp + /followup together)
    warmup:
      enabled: true              # Newly linked accounts (/whatsapp scan) get a lower daily cap
      schedule: [15, 25, 35]     # Day 1, 2, 3; from day 4 the normal daily_limit applies
    active_hours:
      enabled: true
      start: "09:00"             # Only message during these local hours
      end: "23:00"
    abort_on_risk_signals: true  # Stop immediately on rate-limit / forbidden / blocked style errors

smtp:
  host: "smtp.gmail.com"
  port: 465
  secure: true
  auth:
    user: "your-email@gmail.com"
    pass: "your-app-password"  # Gmail App Password (16 characters)
  from_name: "Outreach Team"
  from_email: "your-email@gmail.com"

whatsapp:
  session_name: "outreach-session"
  auth_state_dir: "workflows/whatsapp/auth_info"
  print_qr_in_terminal: true
  connection_timeout_ms: 60000
  retry_interval_seconds: 5

paths:
  assets:
    whatsapp_proposal: "assets/whatsapp/proposal.txt"
    whatsapp_demo: "assets/whatsapp/demo.mp4"
    mail_proposal: "assets/mail/proposal.txt"
    mail_demo: "assets/mail/demo.mp4"
  leads:
    whatsapp: "leads/whatsapp/numbers.yaml"
    mail: "leads/mail/emails.yaml"
    landline: "leads/landline/numbers.yaml"   # scraped landlines (no WhatsApp) are stored here
  reports_dir: "reports"
